name: Address review findings

on:
  push:
    branches: [feature/household-people-foundation]

permissions:
  contents: write

jobs:
  patch-review-findings:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/household-people-foundation

      - name: Detect completed patch
        id: patched
        run: |
          if grep -q "replaceSameDay" routes/grocery.js && grep -q "validateHouseholdReferences" routes/prices.js && test -f tests/api/security.test.js; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply review fixes
        if: steps.patched.outputs.done != 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"Expected patch target not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # 1) Stored-XSS sink: escape store and unit text before placing it in innerHTML.
          replace('public/js/ui.js', r'''function buildCallout(entries) {
            if (!entries || entries.length < 2) return '';
            const sorted = [...entries].sort((a, b) => a.pricePerUnit - b.pricePerUnit);
            const best = sorted[0];
            const worst = sorted[1];
            const unit = best.item?.unit || best.itemId?.unit || 'unit';
            return `<div class="callout-box">
              Best value: ${best.quantity}${unit} @ ${formatCurrency(best.price)} (${formatPPU(best.pricePerUnit, unit)}) at ${best.store?.name || best.storeId?.name}
              vs ${worst.quantity}${unit} @ ${formatCurrency(worst.price)} (${formatPPU(worst.pricePerUnit, unit)}) at ${worst.store?.name || worst.storeId?.name}
            </div>`;
          }''', r'''function buildCallout(entries) {
