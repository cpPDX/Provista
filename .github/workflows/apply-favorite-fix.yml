name: Apply favorite meal stale-state fix

on:
  push:
    branches: [fix/favorite-meal-stale-state]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[apply-favorite-fix]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/favorite-meal-stale-state

      - name: Patch favorite meal state handling
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('public/js/mealPlan.js')
          text = path.read_text()

          use_start = text.index('async function useFavoriteInRow')
          picker_start = text.index('async function openFavoritePicker', use_start)
          use_block = text[use_start:picker_start]

          replacements = [
              ('name: favorite.name,', 'name: used.name,'),
              ("notes: favorite.notes || ''", "notes: used.notes || ''"),
              ('showToast(`${favorite.name} planned`);', 'showToast(`${used.name} planned`);'),
          ]
          for old, new in replacements:
              count = use_block.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one useFavoriteInRow target for {old!r}, found {count}')
              use_block = use_block.replace(old, new, 1)

          picker_end = text.index('function favoriteDestinationChoices', picker_start)
          picker_block = text[picker_start:picker_end]
          old_picker = 'const favorites = await loadMealFavorites();'
          if picker_block.count(old_picker) != 1:
              raise SystemExit('Expected one picker favorites load target')
          picker_block = picker_block.replace(old_picker, 'const favorites = await loadMealFavorites(true);', 1)

          text = text[:use_start] + use_block + picker_block + text[picker_end:]
          path.write_text(text)
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/js/mealPlan.js
          git commit -m "fix: use fresh favorite meal state"
          git push origin HEAD:fix/favorite-meal-stale-state
