name: Refresh production dependencies

on:
  push:
    branches: [feature/household-people-foundation]

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/household-people-foundation

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Upgrade vulnerable production packages
        run: npm install --save 'bcrypt@^6.0.0' 'express@^4.22.2' 'mongoose@^8.24.3'

      - name: Verify production audit
        run: npm audit --omit=dev --audit-level=high

      - name: Commit refreshed manifest and lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Upgrade vulnerable production dependencies"
          git push origin HEAD:feature/household-people-foundation
