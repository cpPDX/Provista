name: App CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check browser JavaScript syntax
        run: |
          node --check public/js/api.js
          node --check public/js/more.js
          node --check public/js/householdPeople.js
          node --check public/js/groceryEntry.js
          node --check public/js/csvImportUnified.js
          node --check public/js/mealPlan.js

      - name: Run API test suite
        run: npm run test:api