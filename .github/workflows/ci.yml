name: App CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  refresh-production-deps:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/household-people-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/household-people-foundation

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Upgrade vulnerable production packages
        run: npm install --save 'bcrypt@^6.0.0' 'express@^4.22.2' 'mongoose@^8.24.3'

      - name: Verify production audit
        run: npm audit --omit=dev --audit-level=high

      - name: Commit refreshed manifest and lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Upgrade vulnerable production dependencies"
          git push origin HEAD:feature/household-people-foundation

  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check JavaScript syntax
        run: |
          node --check public/js/api.js
          node --check public/js/more.js
          node --check public/js/householdPeople.js
          node --check public/js/groceryEntry.js
          node --check public/js/csvImportUnified.js
          node --check public/js/mealPlan.js
          node --check tests/e2e/prices.spec.js
          node --check tests/e2e/mealPlan.spec.js

      - name: Run API test suite
        run: npm run test:api
