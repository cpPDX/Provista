name: App CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

# Pull requests are the authoritative validation path for feature branches.
# Push validation is reserved for persistent integration branches so a PR update
# does not start a second, immediately-cancelled workflow run for the same commit.
concurrency:
  group: app-ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build React migration client
        run: npm run client:build

      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check public/sw.js
          node --check public/js/api.js
          node --check public/js/app.js
          node --check public/js/autocomplete.js
          node --check public/js/offline.js
          node --check public/js/ui.js
          node --check public/js/confirmAction.js
          node --check public/js/more.js
          node --check public/js/moreInit.js
          node --check public/js/catalog.js
          node --check public/js/pantry.js
          node --check public/js/householdPeople.js
          node --check public/js/groceryEntry.js
          node --check public/js/csvImportUnified.js
          node --check public/js/mealPlan.js
          node --check public/js/home.js
          node --check public/js/onboarding.js
          node --check public/js/reactHomeBridge.js
          node --check public/js/prices.js
          node --check public/js/spend.js
          node --check public/js/shoppingList.js
          node --check public/js/rapidShoppingCapture.js
          node --check models/FavoriteMeal.js
          node --check models/Household.js
          node --check models/InventoryItem.js
          node --check models/InventoryEvent.js
          node --check models/Item.js
          node --check models/MealPlan.js
          node --check models/PriceObservation.js
          node --check models/ShoppingTrip.js
          node --check models/User.js
          node --check services/completeShoppingTrip.js
          node --check services/mealReconciliationActions.js
          node --check services/externalPricing/providerRegistry.js
          node --check services/externalPricing/openPricesProvider.js
          node --check services/passwordResetEmail.js
          node --check utils/inventoryLedger.js
          node --check utils/mealAllocations.js
          node --check utils/mealReconciliation.js
          node --check utils/mealShopping.js
          node --check routes/barcode.js
          node --check routes/mealPlan.js
          node --check routes/onboarding.js
          node --check routes/auth.js
          node --check routes/externalPrices.js
          node --check routes/household.js
          node --check routes/inventory.js
          node --check routes/items.js
          node --check routes/shoppingList.js
          node --check routes/shoppingTrips.js
          node --check routes/spend.js
          node --check routes/stores.js
          node --check tests/api/externalPrices.test.js
          node --check tests/api/inventoryLedger.unit.test.js
          node --check tests/api/itemUnit.unit.test.js
          node --check tests/api/mealAllocations.unit.test.js
          node --check tests/api/mealReconciliationCorrections.test.js
          node --check tests/api/mealShopping.test.js
          node --check tests/api/onboarding.test.js
          node --check tests/api/pro76Regression.test.js
          node --check tests/api/shoppingQuantityProvenance.test.js
          node --check tests/api/uxBatch1.test.js
          node --check tests/e2e/prices.spec.js
          node --check tests/e2e/mealPlan.spec.js
          node --check tests/e2e/home.spec.js
          node --check tests/e2e/help.spec.js
          node --check tests/e2e/navigation.spec.js
          node --check tests/e2e/shoppingList.spec.js
          node --check tests/e2e/rapidShoppingCapture.spec.js
          node --check tests/e2e/inventory.spec.js
          node --check tests/e2e/destructiveActions.spec.js
          node --check tests/e2e/household.spec.js
          node --check tests/e2e/auth.spec.js
          node --check tests/e2e/accessibility.spec.js
          node --check tests/e2e/uxBatch1.spec.js
          node --check tests/e2e/releaseFeedback.spec.js
          node --check tests/e2e/reactShell.spec.js
          node --check tests/e2e/reactShoppingList.spec.js
          node --check tests/e2e/reactPantry.spec.js
          node --check tests/e2e/reactPlan.spec.js
          node --check tests/e2e/pro72Plan.spec.js
          node --check tests/e2e/pro72MobileReflow.spec.js
          node --check tests/e2e/pro21Barcode.spec.js
          node --check tests/e2e/pro75ListContext.spec.js
          node --check tests/e2e/pro76Reconciliation.spec.js
          node --check tests/e2e/pro81HomeState.spec.js
          node --check tests/e2e/pro82ListDetails.spec.js
          node --check tests/e2e/pro83ManageProducts.spec.js
          node --check tests/e2e/reactOnboarding.spec.js
          node --check .github/scripts/staging-deployment-policy.cjs
          node --check .github/scripts/prepare-staging-deployment.cjs
          node --check tests/ci/prepareStagingDeployment.test.js
          node --check tests/ci/stagingDeploymentPolicy.test.js

      - name: Test deployment policy
        run: npm run test:ci-policy

      - name: Run API test suite
        run: npm run test:api

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      JWT_SECRET: ci-e2e-secret
      MONGODB_URI: mongodb://127.0.0.1:27017/grocery-tracker-e2e
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React migration client
        run: npm run client:build

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Run critical household, latency, onboarding, Plan, and mobile accessibility tests
        run: npx playwright test tests/e2e/auth.spec.js tests/e2e/home.spec.js tests/e2e/help.spec.js tests/e2e/prices.spec.js tests/e2e/shoppingList.spec.js tests/e2e/rapidShoppingCapture.spec.js tests/e2e/inventory.spec.js tests/e2e/mealPlan.spec.js tests/e2e/destructiveActions.spec.js tests/e2e/household.spec.js tests/e2e/accessibility.spec.js tests/e2e/uxBatch1.spec.js tests/e2e/releaseFeedback.spec.js tests/e2e/reactShell.spec.js tests/e2e/reactShoppingList.spec.js tests/e2e/reactPantry.spec.js tests/e2e/reactPlan.spec.js tests/e2e/pro72Plan.spec.js tests/e2e/pro72MobileReflow.spec.js tests/e2e/pro21Barcode.spec.js tests/e2e/pro75ListContext.spec.js tests/e2e/pro76Reconciliation.spec.js tests/e2e/pro81HomeState.spec.js tests/e2e/pro82ListDetails.spec.js tests/e2e/pro83ManageProducts.spec.js tests/e2e/reactOnboarding.spec.js