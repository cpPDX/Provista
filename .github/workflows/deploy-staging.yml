name: Railway Staging Queue

on:
  workflow_run:
    workflows: [App CI]
    types: [completed]
    branches: [staging]
  schedule:
    # Reconcile away from the top of the hour during Railway's allowed window.
    - cron: '7,37 0-7,20-23 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:

run-name: Railway staging queue (${{ github.event_name }})

# One run may deploy while one newer run waits. GitHub replaces an older pending
# run with the newest one, which naturally coalesces accumulated staging commits.
concurrency:
  group: railway-staging-deployment
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  deployments: write

env:
  RAILWAY_CLI_VERSION: '5.48.0'
  RAILWAY_PROJECT_ID: ad0aa81b-a6f1-429f-8b59-454efcef19cd
  RAILWAY_ENVIRONMENT_ID: 0f4d907c-6900-4ae0-b5a0-7b77a693cac6
  RAILWAY_SERVICE_ID: 632e7932-9a99-49d5-ab48-49ab2e8e0605
  STAGING_HEALTH_URL: https://provista-staging.up.railway.app/api/health/ready

jobs:
  prepare:
    name: Resolve current green staging head
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.prepare.outputs.action }}
      target_sha: ${{ steps.prepare.outputs.target_sha }}
      deployment_id: ${{ steps.prepare.outputs.deployment_id }}
      reason: ${{ steps.prepare.outputs.reason }}
    steps:
      - name: Check out deployment policy
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Resolve and record deployment intent
        id: prepare
        uses: actions/github-script@v8
        with:
          script: |
            const { prepare } = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/prepare-staging-deployment.cjs`
            );
            await prepare({ github, context, core });

  reconcile:
    name: Reconcile Railway staging
    needs: prepare
    if: needs.prepare.outputs.action == 'reconcile'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out trusted deployment control
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Check out exact staging source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}
          path: staging-source
          persist-credentials: false

      - name: Revalidate SHA and deployment window
        id: revalidate
        uses: actions/github-script@v8
        env:
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
          DEPLOYMENT_ID: ${{ needs.prepare.outputs.deployment_id }}
        with:
          script: |
            const { revalidate } = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/prepare-staging-deployment.cjs`
            );
            await revalidate({
              github,
              context,
              core,
              targetSha: process.env.TARGET_SHA,
              deploymentId: process.env.DEPLOYMENT_ID
            });

      - name: Explain a boundary deferral or superseded SHA
        if: steps.revalidate.outputs.proceed != 'true'
        env:
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
          REASON: ${{ steps.revalidate.outputs.reason }}
        run: |
          {
            echo '### Railway staging deployment'
            echo "- SHA: \`${TARGET_SHA}\`"
            echo '- State: **queued or superseded**'
            echo "- Detail: ${REASON}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify staging deployment credentials
        if: steps.revalidate.outputs.proceed == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
        run: |
          if [[ -z "$RAILWAY_TOKEN" ]]; then
            echo '::error::Missing RAILWAY_STAGING_TOKEN repository secret.'
            exit 1
          fi

      - name: Set up Node.js
        if: steps.revalidate.outputs.proceed == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '20.19.0'

      - name: Install pinned Railway CLI
        if: steps.revalidate.outputs.proceed == 'true'
        run: npm install --global "@railway/cli@${RAILWAY_CLI_VERSION}"

      - name: Fetch Railway deployment history
        if: steps.revalidate.outputs.proceed == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
        run: |
          railway deployment list \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --limit 100 \
            --json > "$RUNNER_TEMP/railway-deployments.json"

      - name: Inspect Railway deployment history
        id: railway
        if: steps.revalidate.outputs.proceed == 'true'
        env:
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
        run: |
          node .github/scripts/staging-deployment-policy.cjs \
            inspect-railway \
            "$RUNNER_TEMP/railway-deployments.json" \
            "$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Record an active native Railway deployment
        if: steps.railway.outputs.state == 'active'
        uses: actions/github-script@v8
        env:
          DEPLOYMENT_ID: ${{ needs.prepare.outputs.deployment_id }}
          RAILWAY_STATUS: ${{ steps.railway.outputs.railway_status }}
        with:
          script: |
            const { setManagedDeploymentStatus } = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/prepare-staging-deployment.cjs`
            );
            await setManagedDeploymentStatus({
              github,
              context,
              deploymentId: process.env.DEPLOYMENT_ID,
              state: 'pending',
              description: `Railway is already ${process.env.RAILWAY_STATUS || 'processing this SHA'}`
            });
            core.summary
              .addHeading('Railway staging deployment')
              .addRaw('- State: **already active in Railway**\n')
              .addRaw(`- Railway status: ${process.env.RAILWAY_STATUS || 'active'}\n`);
            await core.summary.write();

      - name: Mark Railway deployment in progress
        if: >-
          steps.revalidate.outputs.proceed == 'true' &&
          steps.railway.outputs.state != 'active' &&
          steps.railway.outputs.state != 'succeeded'
        uses: actions/github-script@v8
        env:
          DEPLOYMENT_ID: ${{ needs.prepare.outputs.deployment_id }}
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
        with:
          script: |
            const { setManagedDeploymentStatus } = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/prepare-staging-deployment.cjs`
            );
            await setManagedDeploymentStatus({
              github,
              context,
              deploymentId: process.env.DEPLOYMENT_ID,
              state: 'in_progress',
              description: `Deploying staging ${process.env.TARGET_SHA.slice(0, 7)} to Railway`
            });

      - name: Deploy exact staging commit to Railway
        if: >-
          steps.revalidate.outputs.proceed == 'true' &&
          steps.railway.outputs.state != 'active' &&
          steps.railway.outputs.state != 'succeeded'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
        working-directory: staging-source
        run: |
          railway up . --ci --path-as-root \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --message "GitHub staging ${TARGET_SHA}"

      - name: Verify staging readiness
        if: >-
          steps.revalidate.outputs.proceed == 'true' &&
          steps.railway.outputs.state != 'active'
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 18 \
            --retry-all-errors \
            --retry-delay 10 \
            --connect-timeout 10 \
            --max-time 20 \
            --output "$RUNNER_TEMP/staging-health.json" \
            "$STAGING_HEALTH_URL"
          node -e "const body = require(process.argv[1]); if (body.status !== 'ready' || body.database !== 'connected') process.exit(1)" \
            "$RUNNER_TEMP/staging-health.json"

      - name: Record successful staging deployment
        if: >-
          success() &&
          steps.revalidate.outputs.proceed == 'true' &&
          steps.railway.outputs.state != 'active'
        uses: actions/github-script@v8
        env:
          DEPLOYMENT_ID: ${{ needs.prepare.outputs.deployment_id }}
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
          STAGING_HEALTH_URL: ${{ env.STAGING_HEALTH_URL }}
          RAILWAY_STATE: ${{ steps.railway.outputs.state }}
        with:
          script: |
            const { setManagedDeploymentStatus } = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/prepare-staging-deployment.cjs`
            );
            const adopted = process.env.RAILWAY_STATE === 'succeeded';
            await setManagedDeploymentStatus({
              github,
              context,
              deploymentId: process.env.DEPLOYMENT_ID,
              state: 'success',
              description: adopted
                ? `Verified existing Railway deployment ${process.env.TARGET_SHA.slice(0, 7)}`
                : `Deployed and verified staging ${process.env.TARGET_SHA.slice(0, 7)}`,
              environmentUrl: process.env.STAGING_HEALTH_URL.replace('/api/health/ready', ''),
              autoInactive: true
            });
            core.summary
              .addHeading('Railway staging deployment')
              .addRaw(`- SHA: \`${process.env.TARGET_SHA}\`\n`)
              .addRaw(`- State: **${adopted ? 'adopted and verified' : 'deployed and verified'}**\n`)
              .addLink('Staging health', process.env.STAGING_HEALTH_URL);
            await core.summary.write();

      - name: Record failed staging deployment
        if: failure() && steps.revalidate.outputs.proceed == 'true'
        uses: actions/github-script@v8
        env:
          DEPLOYMENT_ID: ${{ needs.prepare.outputs.deployment_id }}
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
        with:
          script: |
            const { setManagedDeploymentStatus } = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/prepare-staging-deployment.cjs`
            );
            await setManagedDeploymentStatus({
              github,
              context,
              deploymentId: process.env.DEPLOYMENT_ID,
              state: 'failure',
              description: `Railway staging ${process.env.TARGET_SHA.slice(0, 7)} failed; retry remains eligible`
            });
            core.summary
              .addHeading('Railway staging deployment')
              .addRaw(`- SHA: \`${process.env.TARGET_SHA}\`\n`)
              .addRaw('- State: **failed; eligible for the next allowed-window retry**\n');
            await core.summary.write();
